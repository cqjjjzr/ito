[package]
name = "ito-tray"
description = "The tray of the Ito agent for Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
ito-agent-core.workspace = true
ito-shared.workspace = true
serde_json.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
ito-agent-windows = { path = "../agent-windows" }
muda = "0.21"
tray-icon = "0.26"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
