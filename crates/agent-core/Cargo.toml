[package]
name = "ito-agent-core"
description = "What Ito agents share: the controller client, connections and keeping them in sync"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
# The command line, for the agents' executables.
clap = { workspace = true, features = ["derive"], optional = true }
chrono = { workspace = true, features = ["serde"] }
getrandom.workspace = true
ipnet.workspace = true
ito-shared.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
url.workspace = true

# Windows hosts verify the controller through SChannel and the Windows certificate store.
[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["json", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { workspace = true, features = ["json", "rustls"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
cli = ["dep:clap"]

[dev-dependencies]
# Unit tests of the `cli` module need the feature that compiles it.
ito-agent-core = { workspace = true, features = ["cli"] }
mockall.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
