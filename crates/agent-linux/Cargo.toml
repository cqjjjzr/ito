[package]
name = "ito-agent"
description = "Connects a Linux host to Ito controllers as their devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
ito-agent-core = { workspace = true, features = ["cli"] }
ito-shared.workspace = true
ipnet.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
xshell.workspace = true

[dev-dependencies]
mockall.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.deb]
name = "ito-agent"
maintainer = "Ito contributors <noreply@localhost>"
copyright = "Ito contributors"
section = "net"
extended-description = "Connects this host to Ito controllers as their devices and keeps each WireGuard tunnel in step with its device."
depends = "$auto, ca-certificates, iproute2, wireguard-tools"
recommends = "nftables"
suggests = "systemd-resolved"
maintainer-scripts = "../../packaging/debian/"
systemd-units = { unit-name = "ito-agent", enable = true, start = true }
assets = [
    ["target/release/ito-agent", "usr/bin/", "755"],
    ["../../THIRD_PARTY_NOTICES.md", "usr/share/doc/ito-agent/", "644"],
]
