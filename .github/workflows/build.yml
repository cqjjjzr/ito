name: Build
on:
  push:
    branches: [main]
jobs:
  debian:
    runs-on: ubuntu-latest
    container: rust:1.99-trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends dpkg-dev
      - run: rustup show active-toolchain
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          check-latest: true
      - uses: extractions/setup-just@v4
      - run: just build-web
      - run: just check test-rust test-web
      - run: cargo install --locked cargo-deb
      - run: just deb-server deb-agent
      - uses: actions/upload-artifact@v4
        with:
          name: ito-debian13-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: packaging/windows/global.json
      - run: pwsh -NoProfile -File packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ito-windows-x64
          path: dist/windows/x64/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
