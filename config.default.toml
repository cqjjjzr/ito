# Default values, or examples for keys without a default.
# Generated from crates/server/src/config.rs by `just generate-config`.

# Socket address for the HTTP listener. Deploy a TLS-terminating reverse proxy in front of this
# address.
listen = "127.0.0.1:8000"

# Socket address for the Prometheus `/metrics` listener. Leave unset to disable the metrics
# listener.
# metrics_listen = "127.0.0.1:8001"

# External browser origin of the service: scheme, lowercase host, and optional non-default port,
# with no path or trailing slash. Used to validate the `Origin` header on state-changing requests
# and to construct the OIDC redirect URI.
# Required.
# public_url = "https://vpn.example.com"

# Whether session and login cookies set the `Secure` attribute and `__Host-` prefix. Set to `false`
# only for local plain-HTTP testing.
cookie_secure = true

# Absolute path to the SQLite database file. The controller holds an exclusive file lock on this
# path while running.
database = "/var/lib/ito/ito.db"

# Maximum lifetime of a browser session before the user must sign in again.
session_lifetime = "12h"

# Maximum idle time between requests for a browser session. Must not exceed `session_lifetime`.
session_idle = "1h"

# Validity period of a device's WireGuard public key after it is set or renewed, at least 4 days.
# When a key expires, the reconciler removes the peer from the kernel until a key is set again.
key_lifetime = "365days"

# OpenID Connect relying-party settings for browser sign-in.
[oidc]

# OpenID Connect issuer URL.
# Required.
# issuer = "https://id.example.com/realms/ito"

# OAuth 2.0 client ID for browser sign-in.
# Required.
# client_id = "ito"

# Absolute path to the file containing the OIDC client secret. Re-read on each use so secret
# rotation does not require a restart.
# Required.
# secret_file = "/etc/ito/oidc.secret"

# Group names in the ID token's `groups` claim that grant administrator privileges for the session.
admin_groups = []

# Optional SCIM 2.0 user status polling. When configured, the controller checks user status at
# sign-in and periodically on `interval`, revoking sessions and device keys when an account is
# disabled or deleted at the identity provider.
# [scim]

# Base URL of the SCIM 2.0 service.
# Required.
# url = "https://id.example.com/realms/ito/scim/v2"

# OAuth 2.0 client ID used for client-credentials token requests to the SCIM API.
# Required.
# client_id = "ito-status"

# Absolute path to the file containing the SCIM client secret.
# Required.
# secret_file = "/etc/ito/status.secret"

# SCIM User ID of a canary account that remains permanently enabled. Before acting on a negative
# lookup result (disabled or 404), the controller verifies that this canary user is still reported
# as active, preventing upstream directory outages from mass-revoking accounts.
# health_subject = ""

# Interval between background SCIM status sweeps across all accounts.
# interval = "6h"

# Managed WireGuard interfaces keyed by Linux interface name (which also serves as the interface ID
# in the API).
# [interfaces.NAME]

# Absolute path to the server's WireGuard private key file (as generated by `wg genkey`). Read once
# at startup.
# Required.
# private_key_file = "/etc/ito/keys/wg0.key"

# UDP port the server interface listens on.
# Required.
# listen_port = 51820

# External `host:port` endpoint that clients connect to.
# Required.
# endpoint = "vpn.example.com:51820"

# CIDR addresses assigned to the server interface, such as `10.0.0.1/24`.
# addresses = []

# MTU of the server interface.
# mtu = 1420

# When `true`, the reconciler brings the interface down and removes all peers.
# disabled = false

# Suggested MTU for client configs, or `0` to let the client choose automatically.
# client_mtu = 0

# DNS server IP addresses included in client configs.
# dns = []

# DNS search domains included in client configs.
# dns_search = []

# Authoritative DNS zone served by `[dns]` for devices on this interface, or empty to disable.
# Multiple interfaces can share a zone. Also appended to the client's DNS search domains after
# `dns_search`.
# dns_zone = ""

# PersistentKeepalive interval in seconds for client configs, or `0` to disable.
# keepalive = 0

# ID of the default route profile for clients, or empty when `route_profiles` is empty.
# default_profile_id = ""

# Named sets of client-side `AllowedIPs` that users can choose between.
# [[interfaces.NAME.route_profiles]]

# Profile identifier: a DNS label that is unique within the interface.
# Required.
# id = "all"

# Display name shown to users in the portal and agent UI.
# Required.
# name = "All traffic"

# Client-side `AllowedIPs` prefixes routed through the tunnel when this profile is active.
# Required.
# allowed_ips = ["0.0.0.0/0", "::/0"]

# Address pools from which device addresses and prefix grants are allocated.
# [[interfaces.NAME.pools]]

# CIDR prefix of the pool, such as `10.0.0.0/24`. Pools must not overlap within or across
# interfaces.
# Required.
# prefix = "10.0.0.0/24"

# Minimum prefix length (largest block size) a single grant from this pool may have. When unset,
# only single-host grants (`/32` or `/128`) are allowed.
# min_prefix_length = 28

# Maximum number of grants a single device may hold from this pool.
# max_prefixes = 1

# Sub-prefixes inside the pool that are reserved and never allocated to devices.
# exclusions = []

# Optional authoritative DNS server for interface `dns_zone` domains. Publishes `A` and `AAAA`
# records at `<dns_name>.<dns_zone>` for each device that has a `dns_name`.
# [dns]

# UDP and TCP socket address for the authoritative DNS listener.
# listen = "[::1]:53"

# Authoritative nameserver hostname placed in zone `NS` and `SOA` records. Must lie outside every
# configured `dns_zone` and resolve independently, because the server does not publish glue records.
# Required.
# name_server = "vpn.example.com"

# Time to live in seconds for DNS records and negative caching responses.
# ttl = 60

# Default per-account address limits. Each limit is a decimal address count (such as `"16"`), a CIDR
# prefix length (such as `"/64"`), or `""` for unlimited. Administrators can override these defaults
# on individual accounts.
[quota]

# Default IPv4 address limit per account.
ipv4 = "16"

# Default IPv6 address limit per account.
ipv6 = "/64"

# Logging configuration.
[log]

# Log filter directives in `tracing_subscriber::EnvFilter` syntax, such as `info` or
# `info,ito::reconcile=debug`.
level = "info,hickory_server=warn"

# Whether to log every HTTP response at `info` level. Leave `false` when the reverse proxy already
# records access logs.
requests = false

# Output format: `auto` (systemd journal when stderr is connected to journald, otherwise plain text
# on stderr), `text` (plain text on stderr), or `json` (newline-delimited JSON on stderr).
format = "auto"
